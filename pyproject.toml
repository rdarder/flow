[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barevision"
version = "0.1.0"
description = "Barevision project - non-semantic perception for cheap robots"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["barevision", "dataset", "model", "training", "perception", "optical-flow", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jax",
    "flax",
    "platformdirs>=3.0",
    "tyro>=1.0.0",
    "orbax-checkpoint>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "isort",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/yourusername/flow"
Repository = "https://github.com/yourusername/flow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/barevision"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "tensorboard (>=2.20.0,<3.0.0)",
    "torchvision (>=0.25.0,<0.26.0)",
    "setuptools (==81.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "black (>=26.3.0,<27.0.0)"
]
